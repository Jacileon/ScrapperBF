<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entreprises · VEILLE BF</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/app-shell.css">
<style>
.ent-card{gap:12px}
.ent-head{display:flex;align-items:center;gap:12px}
.ent-avatar{width:44px;height:44px;border-radius:12px;background:var(--primary-light);color:var(--primary);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ent-name{font-size:15px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ent-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.ent-kpi{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
.ent-kpi b{display:block;font-size:16px;font-weight:800;line-height:1.1}
.ent-kpi span{font-size:10.5px;color:var(--muted)}
.ent-win{color:var(--primary)}
.ent-contacts{display:flex;flex-direction:column;gap:10px}
.ent-contact{display:flex;gap:10px;align-items:center;font-size:13.5px}
.ent-contact .ic{width:32px;height:32px;border-radius:9px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ent-contact span{color:var(--muted);font-size:11px;display:block;text-transform:uppercase;letter-spacing:.3px;font-weight:700}
.ent-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ent-ville-badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--line);color:var(--text);font-weight:500}
.ent-strip{display:flex;flex-direction:column;gap:5px;padding:9px 11px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.ent-strip-row{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);min-width:0}
.ent-strip-row i{color:var(--primary);flex-shrink:0}
.ent-strip-row b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent-strip-row em{color:var(--muted);font-style:normal;font-size:11px;text-transform:uppercase;letter-spacing:.3px;font-weight:700;margin-right:2px}
.ent-contact a{color:var(--primary);font-weight:700;text-decoration:none}
.ent-contact a:hover{text-decoration:underline}
.ent-copy{margin-left:auto;cursor:pointer;color:var(--muted);background:none;border:none;padding:4px;border-radius:6px;display:flex}
.ent-copy:hover{background:var(--primary-light);color:var(--primary)}
</style>
</head>
<body>
<div id="app" data-page="entreprises" data-requires="entreprises"></div>
<main class="main" id="main-content">
  <div id="view-list">
    <section class="markets-hero" style="margin-bottom:16px">
      <p class="eyebrow">Attributaires & soumissionnaires</p>
      <h1>Entreprises</h1>
      <p class="hero-copy">Les entreprises qui remportent les marchés publics : performances, montants et coordonnées.</p>
    </section>
    <section class="stat-band" id="stats"></section>
    <div class="filterbar" style="flex-wrap:wrap">
      <div class="search-box"><i data-icon="search" data-size="18"></i><input id="q" placeholder="Nom, IFU, RCCM, téléphone, ville…"></div>
      <select id="filter-secteur"><option value="">Tous les secteurs</option></select>
      <select id="filter-ville"><option value="">Toutes les villes</option></select>
      <select id="sort">
        <option value="gagnes">Plus de marchés gagnés</option>
        <option value="montant">Montant total remporté</option>
        <option value="soumissions">Plus actives (soumissions)</option>
        <option value="taux">Meilleur taux de réussite</option>
      </select>
    </div>
    <div class="chip-row" id="chips">
      <span class="chip-label">Afficher</span>
      <button class="chip-btn active" data-v="all">Toutes</button>
      <button class="chip-btn" data-v="won"><i data-icon="trophy" data-size="13"></i> Attributaires</button>
      <button class="chip-btn" data-v="tel"><i data-icon="phone" data-size="13"></i> Avec contact</button>
      <button class="chip-btn" data-v="group"><i data-icon="users" data-size="13"></i> Groupements</button>
    </div>
    <div class="results-bar"><div class="rb-count" id="count">—</div></div>
    <section class="mk-grid" id="grid"></section>
    <div id="more-wrap" style="text-align:center;margin-top:18px" hidden><button class="button secondary-button" id="btn-more">Afficher plus</button></div>
  </div>

  <div id="view-detail" hidden></div>
</main>

<script src="assets/data.js"></script>
<script src="assets/data_resultats.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/ui.js"></script>
<script>
(function(){
  function initPage(DR){
  DR = DR || {resultats:[],entreprises:[],stats:{},ready:false};
  var ents = DR.entreprises || [], resultats = DR.resultats || [], LIMIT = 48;
  var state = {q:'', ville:'', secteur:'', sort:'gagnes', scope:'all'};

  function initials(n){ return (n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase(); }

  if(!ents.length){
    document.getElementById('stats').innerHTML='';
    document.getElementById('grid').innerHTML='<div class="empty-soft"><div class="es-ico"><i data-icon="building2" data-size="26"></i></div><strong>Entreprises en cours d’extraction</strong>Les statistiques par entreprise apparaîtront ici dès que les résultats seront traités.</div>';
    document.querySelector('.filterbar').style.display='none';
    document.getElementById('count').textContent='';
    window.renderIcons(document.getElementById('main-content'));
    return;
  }

  // Listes déroulantes villes + secteurs (avec compteurs)
  var selVille = document.getElementById('filter-ville');
  var villesList = (DR.stats && DR.stats.villes) ? DR.stats.villes : [];
  villesList.forEach(function(v){
    var opt = document.createElement('option'); opt.value = v; opt.textContent = v; selVille.appendChild(opt);
  });
  var selSec = document.getElementById('filter-secteur');
  var secCount = {};
  ents.forEach(function(e){ (e.secteurs||[]).forEach(function(s){ secCount[s]=(secCount[s]||0)+1; }); });
  Object.keys(secCount).sort(function(a,b){return secCount[b]-secCount[a];}).forEach(function(s){
    var sh=(window.sectorMeta?window.sectorMeta(s).short:s)||s; var opt=document.createElement('option'); opt.value=s; opt.textContent=sh+' ('+secCount[s]+')'; selSec.appendChild(opt);
  });

  var s = DR.stats || {};
  document.getElementById('stats').innerHTML = [
    ['', 'building2', (s.nb_entreprises||ents.length).toLocaleString('fr-FR'), 'Entreprises recensées'],
    ['blue', 'coins', window.fmtAmount(s.montant_total), 'Montant total remporté'],
    ['amber', 'trophy', ents[0] ? ents[0].nom.slice(0,22) : '—', 'Top attributaire']
  ].map(function(x){ return '<div class="stat-tile '+x[0]+'"><div class="st-ico"><i data-icon="'+x[1]+'" data-size="22"></i></div><div style="min-width:0"><div class="st-val" style="font-size:'+(x[1]==='trophy'?'16px':'25px')+'">'+x[2]+'</div><div class="st-lbl">'+x[3]+'</div></div></div>'; }).join('');

  function card(e){
    var sec = e.secteurs && e.secteurs.length ? window.sectorChip(e.secteurs[0]) : '';
    var villeBadge = e.ville ? '<span class="ent-ville-badge"><i data-icon="map-pin" data-size="11"></i> '+e.ville+'</span>' : '';
    var strip = '';
    if(e.tel || e.ifu){
      strip = '<div class="ent-strip">'
        +(e.tel?'<div class="ent-strip-row"><i data-icon="phone" data-size="14"></i><b>'+e.tel+'</b></div>':'')
        +(e.ifu?'<div class="ent-strip-row"><i data-icon="badge-check" data-size="14"></i><em>IFU</em><b>'+e.ifu+'</b></div>':'')
        +'</div>';
    }
    return '<a class="mk-card ent-card" href="entreprises.html?nom='+encodeURIComponent(e.nom)+'">'
      +'<div class="ent-head"><div class="ent-avatar">'+initials(e.nom)+'</div><div class="ent-name">'+e.nom+'</div></div>'
      +'<div class="ent-meta">'
      +(sec || '')
      +(e.groupement?' <span class="sector-chip" style="--sec:#64748b"><i data-icon="users" data-size="11"></i> Groupement</span>':'')
      +villeBadge
      +'</div>'
      +'<div class="ent-kpis">'
      +'<div class="ent-kpi"><b class="ent-win">'+e.gagnes+'</b><span>gagné'+(e.gagnes>1?'s':'')+'</span></div>'
      +'<div class="ent-kpi"><b>'+e.soumissions+'</b><span>soumis.</span></div>'
      +'<div class="ent-kpi"><b>'+e.taux_reussite+'%</b><span>réussite</span></div>'
      +'</div>'
      +strip
      +'<div class="mk-card-bottom"><span class="deadline-pill result"><i data-icon="coins" data-size="12"></i> '+(e.montant_gagne?window.fmtAmount(e.montant_gagne):(e.gagnes>0?'Répertoire / N.C.':'—'))+'</span><span class="sh-link">Fiche <i data-icon="arrow-right" data-size="13"></i></span></div>'
      +'</a>';
  }

  function filtered(){
    var qLower = state.q ? state.q.toLowerCase().trim() : '';
    var l = ents.filter(function(e){
      var matchQ = !qLower || e.nom.toLowerCase().indexOf(qLower)>-1
                   || (e.adresse && e.adresse.toLowerCase().indexOf(qLower)>-1)
                   || (e.ville && e.ville.toLowerCase().indexOf(qLower)>-1)
                   || (e.tel && e.tel.toLowerCase().indexOf(qLower)>-1)
                   || (e.ifu && e.ifu.toLowerCase().indexOf(qLower)>-1)
                   || (e.rccm && e.rccm.toLowerCase().indexOf(qLower)>-1);
      if(!matchQ) return false;
      if(state.ville && !((e.ville && e.ville.toLowerCase()===state.ville.toLowerCase())
                       || (e.adresse && e.adresse.toLowerCase().indexOf(state.ville.toLowerCase())>-1))) return false;
      if(state.secteur && (!e.secteurs || e.secteurs.indexOf(state.secteur)<0)) return false;
      if(state.scope==='won' && !(e.gagnes>0)) return false;
      if(state.scope==='tel' && !e.tel) return false;
      if(state.scope==='group' && !e.groupement) return false;
      return true;
    });

    if(state.sort==='montant') l.sort(function(a,b){return b.montant_gagne-a.montant_gagne;});
    else if(state.sort==='soumissions') l.sort(function(a,b){return b.soumissions-a.soumissions;});
    else if(state.sort==='taux') l.sort(function(a,b){return b.taux_reussite-a.taux_reussite || b.gagnes-a.gagnes;});
    else l.sort(function(a,b){return b.gagnes-a.gagnes || b.montant_gagne-a.montant_gagne;});
    return l;
  }

  function renderList(){
    var l = filtered(), show = l.slice(0, LIMIT);
    document.getElementById('count').innerHTML = '<b>'+l.length.toLocaleString('fr-FR')+'</b> entreprise'+(l.length>1?'s':'');
    document.getElementById('grid').innerHTML = l.length ? show.map(card).join('')
      : '<div class="empty-soft"><div class="es-ico"><i data-icon="search" data-size="26"></i></div><strong>Aucune entreprise trouvée</strong>Modifiez vos critères de recherche.</div>';
    document.getElementById('more-wrap').hidden = show.length>=l.length;
    window.renderIcons(document.getElementById('grid'));
  }

  function renderDetail(nom, liveDetail){
    var e = (liveDetail && liveDetail.entreprise) || ents.filter(function(x){return x.nom===nom || x.nom.toUpperCase()===nom.toUpperCase();})[0];
    if(!e){ location.href='entreprises.html'; return; }
    var wins = (liveDetail && liveDetail.wins) ? liveDetail.wins : resultats.filter(function(r){
      if(r.infructueux) return false;
      if(r.attributaires_canons && r.attributaires_canons.indexOf(e.nom) >= 0) return true;
      return r.attributaire_canon===e.nom || r.attributaire===e.nom;
    });
    var soums = (liveDetail && liveDetail.soumissions) ? liveDetail.soumissions : [];
    var contact = function(ic,label,val,disp){
      if(!val) return '';
      var shown = disp || val;
      var copy = '<button class="ent-copy" type="button" title="Copier" data-copy="'+(''+val).replace(/"/g,'&quot;')+'"><i data-icon="copy" data-size="14"></i></button>';
      return '<div class="ent-contact"><div class="ic"><i data-icon="'+ic+'" data-size="15"></i></div><div style="flex:1;min-width:0"><span>'+label+'</span>'+shown+'</div>'+copy+'</div>';
    };
    var telDisp = e.tel ? '<a href="tel:'+(''+e.tel).split(/[\/,]/)[0].replace(/\s/g,'')+'">'+e.tel+'</a>' : null;
    var contacts = [
      contact('phone','Téléphone',e.tel,telDisp),
      contact('badge-check','IFU',e.ifu),
      contact('file-text','RCCM',e.rccm),
      contact('mail','Email',e.email, e.email?'<a href="mailto:'+e.email+'">'+e.email+'</a>':null),
      contact('map-pin','Adresse / BP',e.adresse),
      contact('building2','Ville',e.ville)
    ].join('') || '<p class="muted" style="font-size:13px">Coordonnées non renseignées dans les avis.</p>';
    var winRows = wins.length ? wins.map(function(r){
      var lotInfo = r.lot ? ' · Lot ' + r.lot : '';
      var refInfo = r.reference ? ' · Réf. ' + r.reference : '';
      return '<tr><td><strong>'+window.cleanVal(r.objet,'Marché')+'</strong><div class="muted" style="font-size:11px">'+window.cleanVal(r.autorite,'')+lotInfo+refInfo+'</div></td>'
        +'<td style="white-space:nowrap">'+window.cleanVal(r.date,'—')+'</td>'
        +'<td class="amount-cell">'+(r.montant?window.fmtAmount(r.montant):'<span class="muted" style="font-size:11px">Répertoire / N.C.</span>')+'</td>'
        +'<td>'+(r.avis_id?'<a class="button secondary-button" style="padding:4px 10px;font-size:12px" href="market.html?id='+encodeURIComponent(r.avis_id)+'">Avis</a>':'')+'</td></tr>';
    }).join('') : '<tr><td colspan="4" class="muted" style="padding:16px">Aucun marché remporté recensé.</td></tr>';

    var soumSection = '';
    if(soums.length){
      var soumRows = soums.slice(0, 100).map(function(s){
        var st = s.est_attributaire ? '<span style="color:#059669;font-weight:600">Retenu</span>' : '<span class="muted">Non retenu</span>';
        var obs = s.observations ? '<div class="muted" style="font-size:11px;margin-top:2px">'+s.observations+'</div>' : '';
        return '<tr><td><strong>'+window.cleanVal(s.objet,'Marché')+'</strong><div class="muted" style="font-size:11px">'+window.cleanVal(s.autorite,'')+(s.lot?' · Lot '+s.lot:'')+'</div>'+obs+'</td>'
          +'<td style="white-space:nowrap">'+st+(s.conformite?'<div class="muted" style="font-size:11px">'+s.conformite+'</div>':'')+'</td>'
          +'<td class="amount-cell">'+(s.montant_offre?window.fmtAmount(s.montant_offre):'—')+'</td></tr>';
      }).join('');
      soumSection = '<div class="panel" style="margin-top:16px"><h2 style="font-size:15px;margin:0 0 10px"><i data-icon="file-text" data-size="15" style="color:var(--primary)"></i> Historique des soumissions &amp; observations ('+soums.length+')</h2>'
        +'<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Marché &amp; observations</th><th>Statut</th><th>Montant offre</th></tr></thead><tbody>'+soumRows+'</tbody></table></div></div>';
    }

    document.getElementById('view-list').hidden = true;
    var dv = document.getElementById('view-detail'); dv.hidden = false;
    dv.innerHTML =
      '<div class="breadcrumb"><a class="link" href="entreprises.html">Entreprises</a><i data-icon="chevron-right" data-size="13"></i><span>Fiche</span></div>'
      +'<div class="panel" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px">'
      +'<div class="ent-avatar" style="width:58px;height:58px;border-radius:14px;font-size:20px">'+initials(nom)+'</div>'
      +'<div style="flex:1;min-width:240px"><h1 style="margin:0 0 6px;font-size:21px">'+nom+'</h1><div style="display:flex;gap:6px;flex-wrap:wrap">'+(e.secteurs||[]).map(window.sectorChip).join('')+(e.groupement?'<span class="sector-chip" style="--sec:#64748b"><i data-icon="users" data-size="11"></i> Groupement</span>':'')+(e.ville?'<span class="ent-ville-badge"><i data-icon="map-pin" data-size="11"></i> '+e.ville+'</span>':'')+'</div></div></div>'
      +'<section class="stat-band" style="grid-template-columns:repeat(4,1fr)">'
      +'<div class="stat-tile"><div class="st-ico"><i data-icon="trophy" data-size="20"></i></div><div><div class="st-val">'+e.gagnes+'</div><div class="st-lbl">Marchés gagnés</div></div></div>'
      +'<div class="stat-tile blue"><div class="st-ico"><i data-icon="coins" data-size="20"></i></div><div><div class="st-val" style="font-size:'+(e.montant_gagne?'19px':'14px')+'">'+(e.montant_gagne?window.fmtAmount(e.montant_gagne):(e.gagnes>0?'Répertoires / N.C.':'—'))+'</div><div class="st-lbl">Total remporté</div></div></div>'
      +'<div class="stat-tile amber"><div class="st-ico"><i data-icon="file-text" data-size="20"></i></div><div><div class="st-val">'+e.soumissions+'</div><div class="st-lbl">Soumissions</div></div></div>'
      +'<div class="stat-tile"><div class="st-ico"><i data-icon="gauge" data-size="20"></i></div><div><div class="st-val">'+e.taux_reussite+'%</div><div class="st-lbl">Taux de réussite</div></div></div>'
      +'</section>'
      +'<div class="mkt-layout" style="grid-template-columns:minmax(0,1fr) 300px;margin-top:4px">'
      +'<div class="panel"><h2 style="font-size:15px;margin:0 0 10px"><i data-icon="trophy" data-size="15" style="color:var(--primary)"></i> Marchés remportés</h2>'
      +'<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Objet</th><th>Date</th><th>Montant</th><th></th></tr></thead><tbody>'+winRows+'</tbody></table></div></div>'
      +'<div class="panel"><h2 style="font-size:15px;margin:0 0 12px"><i data-icon="phone" data-size="15" style="color:var(--primary)"></i> Coordonnées</h2><div class="ent-contacts">'+contacts+'</div>'
      +'<p class="muted" style="font-size:11.5px;margin:12px 0 0">'+e.conformes+' offre'+(e.conformes>1?'s':'')+' jugée'+(e.conformes>1?'s':'')+' conforme'+(e.conformes>1?'s':'')+' sur '+e.soumissions+' soumission'+(e.soumissions>1?'s':'')+'.</p></div>'
      +'</div>'
      +soumSection;
    window.renderIcons(dv);
    dv.querySelectorAll('.ent-copy').forEach(function(btn){
      btn.addEventListener('click',function(ev){ ev.preventDefault(); var v=this.getAttribute('data-copy');
        if(navigator.clipboard){ navigator.clipboard.writeText(v).then(function(){ if(window.toast)window.toast('Copié : '+v); }); } });
    });
  }

  var nom = (location.search.match(/nom=([^&]+)/)||[])[1];
  if(nom){
    var decodedNom = decodeURIComponent(nom.replace(/\+/g,' '));
    fetch('/api/data/entreprise?nom=' + encodeURIComponent(decodedNom))
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(detail){ renderDetail(decodedNom, detail); })
      .catch(function(){ renderDetail(decodedNom, null); });
  }
  else {
    document.getElementById('q').addEventListener('input',function(){state.q=this.value;LIMIT=48;renderList();});
    document.getElementById('filter-ville').addEventListener('change',function(){state.ville=this.value;LIMIT=48;renderList();});
    document.getElementById('filter-secteur').addEventListener('change',function(){state.secteur=this.value;LIMIT=48;renderList();});
    document.getElementById('sort').addEventListener('change',function(){state.sort=this.value;renderList();});
    document.getElementById('chips').addEventListener('click',function(e){var b=e.target.closest('.chip-btn');if(!b)return;this.querySelectorAll('.chip-btn').forEach(function(x){x.classList.remove('active');});b.classList.add('active');state.scope=b.dataset.v;LIMIT=48;renderList();});
    document.getElementById('btn-more').addEventListener('click',function(){LIMIT+=48;renderList();});
    renderList();
  }
  }

  fetch('/api/data/resultats-live')
    .then(function(res){ if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
    .then(initPage)
    .catch(function(){ initPage(window.DATA_RESULTATS || {resultats:[],entreprises:[],stats:{},ready:false}); });
})();
</script>
<script src="assets/shell.js"></script>
</body>
</html>
