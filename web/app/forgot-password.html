<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mot de passe oublié · VEILLE BF</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/app-shell.css">
<link rel="stylesheet" href="assets/saas.css">
</head>
<body>
<div class="auth-shell">
  <aside class="auth-aside">
    <a class="brand" href="pricing.html"><img src="assets/logo.svg" alt=""> VEILLE BF</a>
    <div>
      <h2>Récupérez l'accès à votre compte.</h2>
      <p>Indiquez votre email : nous vous enverrons les instructions pour réinitialiser votre mot de passe.</p>
    </div>
    <span class="foot">© 2026 Veille BF · Données publiques DGCMEF</span>
  </aside>

  <main class="auth-main">
    <div class="auth-card">
      <h1>Mot de passe oublié</h1>
      <p class="sub">On vous envoie un lien de réinitialisation.</p>

      <form class="auth-form" data-auth="forgot" novalidate>
        <div class="alert error" data-error hidden></div>
        <div class="alert success" data-success hidden></div>
        <div class="field">
          <label for="email">Adresse email</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="vous@entreprise.bf">
        </div>
        <button class="button full lg" type="submit">Envoyer les instructions</button>
      </form>

      <p class="auth-switch"><a class="link" href="login.html">Retour à la connexion</a></p>
    </div>
  </main>
</div>

<script src="assets/icons.js"></script>
<script src="assets/session.js"></script>
<script src="assets/auth.js"></script>
<script>window.renderIcons && window.renderIcons();</script>
</body>
</html>
