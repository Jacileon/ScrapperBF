<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Détail du marché · VEILLE BF</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/app-shell.css">
<style>
.lot-table{width:100%;border-collapse:collapse;margin-top:10px}
.lot-table th,.lot-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
.lot-table th{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.lot-card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px}
.essential{display:flex;flex-direction:column;gap:2px}
.ess-row{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line)}
.ess-row:last-child{border-bottom:none}
.ess-ico{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--primary-light);color:var(--primary)}
.ess-ico.warn{background:var(--danger-light);color:var(--danger)}
.ess-k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:700}
.ess-v{font-size:14px;font-weight:600;margin-top:1px;line-height:1.4}
.val-pill{display:inline-block;padding:2px 8px;border-radius:5px;font-size:12px;font-weight:600}
.val-pill.info{background:var(--blue-light);color:var(--blue)}
.src-card{font-size:12.5px;color:var(--muted);line-height:1.6}
.src-card b{color:var(--ink)}
.countdown-card.mkt-mob-only{display:none}
@media (max-width:1100px){.countdown-card.mkt-desk-only{display:none}.countdown-card.mkt-mob-only{display:block;margin-bottom:4px}}
</style>
</head>
<body>
<div id="app" data-page="markets"></div>
<main class="main" id="main-content">
  <div class="breadcrumb" id="crumb"><a class="link" href="markets.html">Marchés</a><i data-icon="chevron-right" data-size="13"></i><span>Détail</span></div>
  <div id="detail"></div>
  <div class="app-footer"><span>Données publiques issues des bulletins officiels de la DGCMEF.</span><span>© 2026 Veille BF</span></div>
</main>

<script src="assets/data.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/ui.js"></script>
<script>
(function(){
  var D = window.DATA || { markets: [] };
  var V = window.cleanVal;
  var rawId = (location.search.match(/id=([^&]+)/) || [])[1];
  var m = null;
  if (rawId) {
    var decoded = decodeURIComponent(rawId), numId = parseInt(decoded, 10);
    m = D.markets.filter(function(x){ return x.id===decoded || String(x.num_id)===decoded || (!isNaN(numId) && x.num_id===numId); })[0];
  }
  if (!m) m = D.markets[0];
  if (!m) { document.getElementById('detail').innerHTML = '<div class="panel" style="padding:40px;text-align:center">Aucun marché trouvé.</div>'; return; }

  var result = m.status === 'result';
  var d = result ? 0 : window.daysLeft(m.deadline);
  var sMeta = window.sectorMeta(m.sector);

  // Compte à rebours
  var secs = result ? 0 : Math.max(0, Math.floor((new Date(m.deadline + 'T23:59:59') - Date.now()) / 1000));
  var hh = Math.floor((secs % 86400) / 3600), mm = Math.floor((secs % 3600) / 60);
  var cdLabel = result ? '' : (d < 0 ? 'Dépôt clôturé (il y a ' + Math.abs(d) + ' j)' : (d === 0 ? 'Clôture aujourd’hui !' : 'Clôture dans ' + d + ' jour' + (d > 1 ? 's' : '')));
  var cdIcon = d < 0 ? 'lock' : (d === 0 ? 'triangle-alert' : 'clock');
  var countdown = result ? '' :
    '<div class="countdown-card' + (d < 0 ? ' is-closed' : '') + '"><i data-icon="' + cdIcon + '" data-size="22"></i><div class="cd-label">' + cdLabel + '</div><div class="cd-date">' + V(m.deadline_raw, window.fmtDate(m.deadline)) + ' · ' + V(m.deadline_time, '09:00 TU') + '</div><div class="countdown-boxes"><div class="cd-box"><b>' + Math.max(0, d) + '</b><small>JOURS</small></div><div class="cd-box"><b>' + (d < 0 ? 0 : hh) + '</b><small>H</small></div><div class="cd-box"><b>' + (d < 0 ? 0 : mm) + '</b><small>MIN</small></div></div></div>';

  // Chronologie
  var steps = [
    { label: 'Publication de l’avis', sub: V(m.pub_raw, window.fmtDate(m.pub)), state: 'done' },
    { label: result ? 'Résultat publié' : 'Dépôt des offres', sub: V(m.deadline_raw, window.fmtDate(m.deadline)) + ' · ' + V(m.deadline_time, '09:00 TU'), state: result ? 'done' : 'current' },
    { label: 'Ouverture des plis', sub: V(m.opening_datetime, 'Juste après le dépôt'), state: result ? 'done' : 'todo' },
    { label: 'Évaluation & attribution', sub: (m.delai_validite && (''+m.delai_validite).toLowerCase()!=='null') ? (m.delai_validite + ' jours de validité') : 'À venir', state: result ? 'current' : 'todo' }
  ];
  var timeline = '<div class="panel"><div style="font-size:13px;font-weight:700;margin-bottom:12px">Les grandes étapes</div><div class="timeline">'
    + steps.map(function(s){ var ic=s.state==='done'?'check':(s.state==='current'?'clock':'circle'); return '<div class="tl-step"><div class="tl-dot '+s.state+'"><i data-icon="'+ic+'" data-size="12"></i></div><div><div class="tl-label">'+s.label+'</div><div class="tl-sub">'+s.sub+'</div></div></div>'; }).join('')
    + '</div></div>';

  // Lots
  var lots = m.detail_lots || [];
  var nbLots = lots.length || m.lots || 1;
  var lotsHtml;
  if (lots.length > 0) {
    lotsHtml = '<div style="margin-bottom:10px;font-size:13px;color:var(--muted)">Ce marché comporte <strong>' + lots.length + ' lot' + (lots.length>1?'s':'') + '</strong>.</div>'
      + '<table class="lot-table"><thead><tr><th>Lot</th><th>Prestation</th><th>Montant prévu</th><th>Caution</th></tr></thead><tbody>'
      + lots.map(function(lot,i){ return '<tr><td style="font-weight:700;color:var(--primary);white-space:nowrap">'+V(lot.numero_lot,'Lot '+(i+1))+'</td>'
        + '<td>'+V(lot.titre, V(m.title,'Prestation'))+'</td>'
        + '<td style="font-weight:600;white-space:nowrap">'+window.fmtAmount(lot.montant_fcfa)+'</td>'
        + '<td style="color:var(--muted);white-space:nowrap">'+(lot.caution_fcfa?window.fmtAmount(lot.caution_fcfa):'—')+'</td></tr>'; }).join('')
      + '</tbody></table>';
  } else {
    lotsHtml = '<div class="lot-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="val-pill info">Lot unique</span><strong>'+window.fmtAmount(m.amount)+'</strong></div><p style="margin:10px 0 0">'+V(m.title,'Avis de marché public')+'</p></div>';
  }

  // L'essentiel pour soumissionner
  function essRow(ico, k, v, warn){ return '<div class="ess-row"><div class="ess-ico'+(warn?' warn':'')+'"><i data-icon="'+ico+'" data-size="16"></i></div><div><div class="ess-k">'+k+'</div><div class="ess-v">'+v+'</div></div></div>'; }
  var essential = '<div class="essential">'
    + essRow('calendar-days', 'Date & heure limite de dépôt', (result ? 'Marché clôturé — résultat publié' : V(m.deadline_raw, window.fmtDate(m.deadline)) + ' à ' + V(m.deadline_time, '09:00 TU')), !result)
    + essRow('map-pin', 'Où déposer votre offre', V(m.deposit_place, 'Voir le dossier d’appel d’offres (DAO)'))
    + essRow('shield', 'Garantie de soumission (caution)', (m.caution ? window.fmtAmount(m.caution) : 'Non exigée / selon le dossier'))
    + essRow('wallet', 'Retrait du dossier (DAO)', (m.cost_dao ? window.fmtAmount(m.cost_dao) : 'Gratuit / non précisé'))
    + essRow('phone', 'Renseignements & contacts', V(m.contacts, 'Voir le dossier d’appel d’offres'))
    + '</div>';

  // Tableau complet (sans jargon qualité)
  function row(k, v){ return '<tr><td style="font-weight:600">'+k+'</td><td>'+v+'</td></tr>'; }
  var fullTable = '<table class="mkt-info-table">'
    + row('Objet complet', V(m.title,'Avis de marché public'))
    + row('Autorité contractante', '<strong>'+V(m.authority,'Autorité contractante')+'</strong>')
    + row('Ministère de tutelle', V(m.ministry,'Non rattaché'))
    + row('Référence du dossier', '<strong style="color:var(--primary)">'+V(m.ref,'Non spécifiée')+'</strong>')
    + row('Type de procédure', V(m.typeLabel,'Avis de marché'))
    + row('Secteur d’activité', '<strong>'+V(m.sector,'Services divers')+'</strong>')
    + row('Catégorie', '<span class="val-pill info">'+V(m.category,'Général')+'</span>')
    + row('Budget prévisionnel', '<strong style="color:var(--primary)">'+window.fmtAmount(m.amount)+'</strong>')
    + row('Allotissement', (lots.length>1 ? lots.length+' lots' : 'Lot unique'))
    + row('Garantie de soumission', (m.caution?window.fmtAmount(m.caution):'Sans objet / non précisée'))
    + row('Coût du dossier (DAO)', (m.cost_dao?window.fmtAmount(m.cost_dao):'Gratuit / non précisé'))
    + row('Source de financement', V(m.financing,'Budget de l’État')+' (Exercice '+V(m.fiscal_year,'2026')+')')
    + row('Date & heure limites', '<strong>'+V(m.deadline_raw, window.fmtDate(m.deadline))+' à '+V(m.deadline_time,'09:00 TU')+'</strong>')
    + row('Lieu de dépôt', V(m.deposit_place,'Selon le dossier'))
    + row('Ouverture des plis', V(m.opening_datetime,'À la date limite')+(m.opening_place && (''+m.opening_place).toLowerCase()!=='null' ? ' — '+m.opening_place : ''))
    + row('Délai d’exécution', (m.delai_execution && (''+m.delai_execution).toLowerCase()!=='null') ? m.delai_execution+' jours' : 'Selon le dossier')
    + row('Validité des offres', (m.delai_validite && (''+m.delai_validite).toLowerCase()!=='null') ? m.delai_validite+' jours' : '90 jours par défaut')
    + row('Marché réservé', V(m.reserved,'Ouvert à toute entreprise éligible'))
    + row('Qualifications / agréments', V(m.qualifications,'Agrément et conformité administrative exigés'))
    + row('Signataire', V(m.signataire,'La Personne Responsable de la Commande Publique'))
    + row('Publication source', V(m.bulletin,'Quotidien officiel')+' ('+V(m.pages,'—')+') · Paru le '+V(m.pub_raw, window.fmtDate(m.pub)))
    + '</table>';

  var html =
    '<div class="mkt-layout"><div style="min-width:0">'
    + '<section class="mkt-hero">'
    + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">'
    + '<span class="mk-type '+window.typeCls(m.type)+'" style="font-size:12px;padding:4px 11px"><i data-icon="tag" data-size="12"></i> '+V(m.typeLabel,'Avis de marché')+'</span>'
    + window.sectorChip(m.sector)
    + '</div>'
    + '<h1>'+V(m.title,'Avis de marché public')+'</h1>'
    + '<p class="mkt-ref"><strong>Réf. '+V(m.ref,'non spécifiée')+'</strong> · '+V(m.bulletin,'Quotidien officiel')+' ('+V(m.pages,'—')+') · Paru le '+V(m.pub_raw, window.fmtDate(m.pub))+'</p>'
    + '<div class="mkt-actions">'
    + '<button class="button secondary-button" onclick="window.print()"><i data-icon="printer" data-size="14"></i> Imprimer</button>'
    + '<button class="button secondary-button" onclick="navigator.clipboard.writeText(location.href);window.toast(\'Lien copié\')"><i data-icon="share2" data-size="14"></i> Partager</button>'
    + '<button class="button secondary-button" onclick="navigator.clipboard.writeText(\''+V(m.ref,m.id)+'\');window.toast(\'Référence copiée\')"><i data-icon="copy" data-size="14"></i> Copier la réf.</button>'
    + '</div></section>'

    + countdown.replace('countdown-card', 'countdown-card mkt-mob-only')

    + '<div class="mkt-kpis" style="margin-top:4px">'
    + '<div class="mkt-kpi"><div class="k"><i data-icon="coins" data-size="13"></i>Budget prévisionnel</div><div class="v" style="font-size:15px">'+window.fmtAmount(m.amount)+'</div></div>'
    + '<div class="mkt-kpi"><div class="k"><i data-icon="calendar-days" data-size="13"></i>'+(result?'Statut':'Échéance')+'</div><div class="v" style="font-size:13.5px">'+(result?'Résultat publié':(d<0?'Clôturé':V(m.deadline_raw,window.fmtDate(m.deadline))))+'</div></div>'
    + '<div class="mkt-kpi"><div class="k"><i data-icon="layers" data-size="13"></i>Allotissement</div><div class="v">'+nbLots+' lot'+(nbLots>1?'s':'')+'</div></div>'
    + '<div class="mkt-kpi"><div class="k"><i data-icon="shield" data-size="13"></i>Caution</div><div class="v" style="font-size:13.5px">'+(m.caution?window.fmtAmount(m.caution):'Non exigée')+'</div></div>'
    + '</div>'

    + '<div class="panel" style="margin-top:16px"><h2 style="display:flex;align-items:center;gap:8px;font-size:15px"><i data-icon="target" data-size="16" style="color:var(--primary)"></i> L’essentiel pour soumissionner</h2>'+essential+'</div>'

    + '<div class="mkt-tabs" style="margin-top:18px">'
    + '<button class="mkt-tab active" data-tab="infos"><i data-icon="file-text" data-size="14"></i> Toutes les informations</button>'
    + '<button class="mkt-tab" data-tab="lots"><i data-icon="layers" data-size="14"></i> Lots ('+nbLots+')</button>'
    + '</div>'
    + '<div class="panel" style="border-radius:0 0 12px 12px;border-top:none;padding:18px">'
    + '<div data-pane="infos">'+fullTable+'</div>'
    + '<div data-pane="lots" hidden>'+lotsHtml+'</div>'
    + '</div>'
    + '</div>'

    + '<div class="mkt-sidebar" style="display:flex;flex-direction:column;gap:14px">'
    + countdown.replace('countdown-card', 'countdown-card mkt-desk-only')
    + '<a class="button" href="markets.html?sector='+encodeURIComponent(m.sector||'')+'" style="justify-content:center"><i data-icon="layout-dashboard" data-size="15"></i> Voir d’autres marchés du secteur</a>'
    + timeline
    + '<div class="panel src-card"><div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:7px"><i data-icon="book-open" data-size="15" style="color:var(--primary)"></i> Source officielle</div>'
    + 'Avis extrait du <b>'+V(m.bulletin,'Quotidien officiel')+'</b> ('+V(m.pages,'—')+'), publié par la DGCMEF le '+V(m.pub_raw, window.fmtDate(m.pub))+'.</div>'
    + '</div></div>';

  document.getElementById('detail').innerHTML = html;

  // Fil d'Ariane avec secteur
  if(m.sector){
    document.getElementById('crumb').innerHTML = '<a class="link" href="markets.html">Marchés</a><i data-icon="chevron-right" data-size="13"></i><a class="link" href="markets.html?sector='+encodeURIComponent(m.sector)+'">'+sMeta.short+'</a><i data-icon="chevron-right" data-size="13"></i><span>Détail</span>';
  }

  document.querySelectorAll('.mkt-tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('.mkt-tab').forEach(function(x){ x.classList.remove('active'); });
      t.classList.add('active');
      document.querySelectorAll('[data-pane]').forEach(function(p){ p.hidden = p.dataset.pane !== t.dataset.tab; });
    });
  });
  window.renderIcons(document.getElementById('main-content'));
})();
</script>
<script src="assets/shell.js"></script>
</body>
</html>
