<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marchés · VEILLE BF</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/app-shell.css">
</head>
<body>
<div id="app" data-page="markets"></div>
<main class="main" id="main-content">
  <section class="markets-hero" style="margin-bottom:16px">
    <p class="eyebrow">Toutes les opportunités</p>
    <h1 id="mk-h1">Marchés publics</h1>
    <p class="hero-copy" id="mk-sub">Parcourez les appels d'offres et demandes de prix publiés au Burkina Faso.</p>
  </section>

  <div class="filterbar">
    <div class="search-box"><i data-icon="search" data-size="18"></i><input id="q" placeholder="Rechercher un objet, une autorité, une référence…"></div>
    <select id="f-sector"><option value="">Tous les secteurs</option></select>
    <select id="f-type">
      <option value="">Tous les types</option>
      <option value="AO">Appel d'offres</option>
      <option value="DP">Demande de prix</option>
      <option value="MI">Manifestation d'intérêt</option>
    </select>
    <select id="sort">
      <option value="urgent">Échéance la plus proche</option>
      <option value="recent">Plus récents</option>
      <option value="amount">Montant le plus élevé</option>
    </select>
  </div>

  <div class="chip-row" id="deadline-chips">
    <span class="chip-label">Échéance</span>
    <button class="chip-btn active" data-v="all">Toutes</button>
    <button class="chip-btn" data-v="7"><i data-icon="clock" data-size="13"></i> Ferme bientôt</button>
    <button class="chip-btn" data-v="30">Ce mois-ci</button>
    <button class="chip-btn" data-v="open">Encore ouvertes</button>
    <button class="chip-btn" data-v="closed">Clôturées</button>
  </div>

  <div class="results-bar">
    <div class="rb-count" id="count">—</div>
    <div class="rb-tools">
      <select id="page-size"><option value="60">60 par page</option><option value="120">120 par page</option><option value="all">Tout afficher</option></select>
      <button class="button secondary-button" id="btn-export-csv" style="padding:9px 13px;font-size:13px"><i data-icon="download" data-size="15"></i> CSV</button>
    </div>
  </div>

  <section class="mk-grid" id="grid"></section>
  <div id="more-wrap" style="text-align:center;margin-top:18px" hidden><button class="button secondary-button" id="btn-more">Afficher plus de marchés</button></div>

  <div class="app-footer"><span>Données publiques issues des bulletins officiels de la DGCMEF.</span><span>© 2026 Veille BF</span></div>
</main>

<script src="assets/data.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/ui.js"></script>
<script>
(function(){
  var D = window.DATA, LIMIT = 60;
  var state = { q:'', type:'', sector:'', deadline:'all', sort:'urgent' };

  // Pré-remplissage depuis l'URL
  function qp(k){ var m=location.search.match(new RegExp('[?&]'+k+'=([^&]+)')); return m?decodeURIComponent(m[1].replace(/\+/g,' ')):''; }
  state.q = qp('q'); state.sector = qp('sector'); state.type = qp('type');
  if (qp('deadline')) state.deadline = qp('deadline');

  // Options de secteurs depuis les données
  var selSec = document.getElementById('f-sector');
  (D.sectors||[]).forEach(function(s){
    var o=document.createElement('option'); o.value=s[0]; o.textContent=s[0]+' ('+s[1]+')'; selSec.appendChild(o);
  });

  // Appliquer l'état aux contrôles
  document.getElementById('q').value = state.q;
  selSec.value = state.sector;
  document.getElementById('f-type').value = state.type;
  document.querySelectorAll('#deadline-chips .chip-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.v===state.deadline); });

  function bnum(m){ var x=((m.bulletin||'')+' '+(m.id||'')).match(/N[°o]?\s*(\d{3,5})/i); return x?parseInt(x[1],10):0; }

  function filtered(){
    var list = D.markets.filter(function(m){
      if(state.type && m.type!==state.type) return false;
      if(state.sector && m.sector!==state.sector) return false;
      if(state.q){ var q=state.q.toLowerCase(); if((''+(m.title||'')+(m.authority||'')+(m.ref||'')+(m.bulletin||'')).toLowerCase().indexOf(q)<0) return false; }
      if(state.deadline!=='all'){
        if(state.deadline==='closed'){ if(m.status!=='result' && window.daysLeft(m.deadline)>=0) return false; }
        else if(state.deadline==='open'){ if(m.status==='result' || window.daysLeft(m.deadline)<0) return false; }
        else if(state.deadline==='7'){ if(m.status==='result' || window.daysLeft(m.deadline)<0 || window.daysLeft(m.deadline)>7) return false; }
        else if(state.deadline==='30'){ if(m.status==='result' || window.daysLeft(m.deadline)<0 || window.daysLeft(m.deadline)>30) return false; }
      }
      return true;
    });
    if(state.sort==='amount') list.sort(function(a,b){ return (b.amount||0)-(a.amount||0); });
    else if(state.sort==='recent') list.sort(function(a,b){ return bnum(b)-bnum(a); });
    else list.sort(function(a,b){
      var da=a.status==='result'?99999:window.daysLeft(a.deadline), db=b.status==='result'?99999:window.daysLeft(b.deadline);
      da = da<0?9000-da:da; db = db<0?9000-db:db; return da-db;
    });
    return list;
  }

  function render(){
    var list = filtered();
    var show = LIMIT==='all' ? list : list.slice(0, LIMIT);
    var c = document.getElementById('count');
    c.innerHTML = '<b>'+list.length.toLocaleString('fr-FR')+'</b> marché'+(list.length>1?'s':'')+(state.sector?' · '+state.sector:'');
    if(!list.length){
      document.getElementById('grid').innerHTML = '<div class="empty-soft"><div class="es-ico"><i data-icon="search" data-size="26"></i></div><strong>Aucun marché ne correspond</strong>Élargissez votre recherche ou réinitialisez les filtres.</div>';
      document.getElementById('more-wrap').hidden = true;
    } else {
      document.getElementById('grid').innerHTML = show.map(window.marketCard).join('');
      document.getElementById('more-wrap').hidden = (LIMIT==='all' || show.length>=list.length);
    }
    window.renderIcons(document.getElementById('main-content'));
  }

  // Titre contextuel si filtre secteur actif
  if(state.sector){
    document.getElementById('mk-h1').textContent = state.sector;
    document.getElementById('mk-sub').textContent = 'Les marchés publics du secteur « '+state.sector+' ».';
  }

  document.getElementById('q').addEventListener('input', function(){ state.q=this.value; LIMIT=60; render(); });
  selSec.addEventListener('change', function(){ state.sector=this.value; LIMIT=60; render(); });
  document.getElementById('f-type').addEventListener('change', function(){ state.type=this.value; LIMIT=60; render(); });
  document.getElementById('sort').addEventListener('change', function(){ state.sort=this.value; render(); });
  document.getElementById('deadline-chips').addEventListener('click', function(e){
    var b=e.target.closest('.chip-btn'); if(!b) return;
    this.querySelectorAll('.chip-btn').forEach(function(x){ x.classList.remove('active'); });
    b.classList.add('active'); state.deadline=b.dataset.v; LIMIT=60; render();
  });
  document.getElementById('page-size').addEventListener('change', function(){ LIMIT = this.value==='all'?'all':parseInt(this.value,10); render(); });
  document.getElementById('btn-more').addEventListener('click', function(){ LIMIT += 60; render(); });

  // Export CSV des résultats filtrés
  document.getElementById('btn-export-csv').addEventListener('click', function(){
    var list = filtered();
    var headers = ["Objet","Autorite","Reference","Type","Secteur","Budget_FCFA","Date_limite","Lots","Bulletin"];
    var rows = [headers.join(";")];
    list.forEach(function(m){
      rows.push([
        '"'+(m.title||'').replace(/"/g,'""')+'"',
        '"'+(m.authority||'').replace(/"/g,'""')+'"',
        '"'+(m.ref||'').replace(/"/g,'""')+'"',
        '"'+(m.typeLabel||'')+'"',
        '"'+(m.sector||'')+'"',
        m.amount||'',
        '"'+(m.deadline_raw||m.deadline||'')+'"',
        (m.detail_lots&&m.detail_lots.length)||m.lots||1,
        '"'+(m.bulletin||'')+'"'
      ].join(";"));
    });
    var blob = new Blob(["﻿"+rows.join("\n")], {type:"text/csv;charset=utf-8;"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "marches_veillebf.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    window.toast("Export CSV généré ("+list.length+" marchés)");
  });

  render();
})();
</script>
<script src="assets/shell.js"></script>
</body>
</html>
