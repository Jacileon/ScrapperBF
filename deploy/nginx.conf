# ============================================================
# Nginx — reverse proxy pour Veille BF (prod VPS)
# À placer dans /etc/nginx/sites-available/veillebf puis lier dans
# sites-enabled/. TLS : lancer `certbot --nginx` après coup.
# ============================================================
server {
    listen 80;
    server_name veille.exemple.bf;   # <-- votre domaine

    client_max_body_size 5m;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fichiers statiques servis directement par nginx (plus rapide)
    location /assets/ {
        alias /opt/veillebf/web/app/assets/;
        expires 1h;
        access_log off;
    }

    # Pages + API -> serveur applicatif (uvicorn) en local
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
